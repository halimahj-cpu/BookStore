<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BookStore — Книжный магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .banner { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 0; margin-bottom: 30px; border-radius: 0 0 15px 15px; }
        .card-img-top { height: 280px; object-fit: cover; }
    </style>
</head>
<body class="bg-light">

    <div class="banner shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0 fw-bold"><a href="{% url 'index' %}" class="text-white text-decoration-none">📚 BookStore</a></h1>
            <div>
                <a href="{% url 'wishlist' %}" class="btn btn-outline-light btn-sm me-2">Избранное ❤️</a>
                <a href="{% url 'cart_detail' %}" class="btn btn-outline-light btn-sm me-2">Корзина 🛒</a>
                {% if user.is_authenticated %}
                    <span class="me-2 text-white">Привет, <strong>{{ user.username }}</strong></span>
                    <a href="{% url 'logout' %}" class="btn btn-light btn-sm">Выйти</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-light btn-sm me-1">Войти</a>
                    <a href="{% url 'register' %}" class="btn btn-warning btn-sm">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
