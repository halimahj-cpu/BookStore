{% extends 'shop/base.html' %}
{% block content %}
<h2 class="mb-4 fw-bold">Оформление заказа</h2>
<div class="row">
    <div class="col-md-6">
        <form method="post" class="bg-white p-4 rounded shadow-sm">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Подтвердить заказ</button>
        </form>
    </div>
    <div class="col-md-6">
        <div class="bg-white p-4 rounded shadow-sm">
            <h4>Ваш заказ (на сумму: {{ total }} сом)</h4>
            <ul class="list-group mt-3">
                {% for item in items %}
                    <li class="list-group-item d-flex justify-content-between">
                        <span>{{ item.book.title }} ({{ item.quantity }})</span>
                        <span>{{ item.book.price }} сом</span>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endblock %}
